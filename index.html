<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropManager — Crop Production Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <i class="fas fa-seedling"></i>
                </div>
                <h1>CropManager</h1>
                <p>Crop Production Management System</p>
            </div>

            <!-- Auth message -->
            <div class="auth-message" id="auth-message"></div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Sign In</button>
                <button class="auth-tab" data-tab="register">Register</button>
                <button class="auth-tab" data-tab="reset">Reset Password</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="login-form" data-form="login">
                <div class="form-group">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <input type="email" class="form-control" id="login-email" placeholder="you@example.com" required>
                    <div class="form-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password <span class="required">*</span></label>
                    <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required>
                    <div class="form-error"></div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <div class="auth-footer">
                    Don't have an account? <a href="#" data-switch="register">Register</a>
                </div>
            </form>

            <!-- Register Form -->
            <form class="auth-form" id="register-form" data-form="register">
                <div class="form-group">
                    <label class="form-label">Full Name <span class="required">*</span></label>
                    <input type="text" class="form-control" id="reg-name" placeholder="John Chisenga" required>
                    <div class="form-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <input type="email" class="form-control" id="reg-email" placeholder="you@example.com" required>
                    <div class="form-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password <span class="required">*</span></label>
                    <input type="password" class="form-control" id="reg-password" placeholder="Min 6 characters" required minlength="6">
                    <div class="form-error"></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="reg-phone" placeholder="+260 xxx xxx xxx">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" id="reg-location" placeholder="Lusaka, Zambia">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select class="form-control form-select" id="reg-role">
                        <option value="Farmer">Farmer</option>
                        <option value="Farm Manager">Farm Manager</option>
                        <option value="Agronomist">Agronomist</option>
                        <option value="Cooperative Manager">Cooperative Manager</option>
                        <option value="Administrator">Administrator</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
                <div class="auth-footer">
                    Already have an account? <a href="#" data-switch="login">Sign In</a>
                </div>
            </form>

            <!-- Reset Password Form -->
            <form class="auth-form" id="reset-form" data-form="reset">
                <div class="form-group">
                    <label class="form-label">Email Address <span class="required">*</span></label>
                    <input type="email" class="form-control" id="reset-email" placeholder="you@example.com" required>
                    <div class="form-error"></div>
                </div>
                <p style="font-size:12px;color:var(--text-light);margin-bottom:16px;line-height:1.5;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>
                <div class="auth-footer">
                    Remember your password? <a href="#" data-switch="login">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // ---- Auth Page Logic ----
        (function() {
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = document.querySelectorAll('.auth-form');
            const authMessage = document.getElementById('auth-message');

            function showAuthMessage(msg, type) {
                authMessage.textContent = msg;
                authMessage.className = 'auth-message show ' + type;
                setTimeout(() => {
                    authMessage.classList.remove('show');
                }, 6000);
            }

            function switchTab(tabName) {
                tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
                forms.forEach(f => f.classList.toggle('active', f.dataset.form === tabName));
                authMessage.classList.remove('show');
            }

            // Tab clicks
            tabs.forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });

            // Footer link switches
            document.querySelectorAll('[data-switch]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchTab(link.dataset.switch);
                });
            });

            // Login
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!Utils.validateForm(e.target)) return;

                const btn = e.target.querySelector('button[type="submit"]');
                Utils.setBtnLoading(btn, true);

                try {
                    await Auth.login(
                        document.getElementById('login-email').value.trim(),
                        document.getElementById('login-password').value
                    );
                    window.location.href = 'dashboard.html';
                } catch (err) {
                    console.error('Login error:', err);
                    showAuthMessage(err.message || 'Login failed. Please check your credentials.', 'error');
                } finally {
                    Utils.setBtnLoading(btn, false);
                }
            });

            // Register
            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!Utils.validateForm(e.target)) return;

                const pw = document.getElementById('reg-password').value;
                if (pw.length < 6) {
                    showAuthMessage('Password must be at least 6 characters.', 'error');
                    return;
                }

                const btn = e.target.querySelector('button[type="submit"]');
                Utils.setBtnLoading(btn, true);

                try {
                    const { user } = await Auth.register({
                        full_name: document.getElementById('reg-name').value.trim(),
                        email: document.getElementById('reg-email').value.trim(),
                        password: pw,
                        phone: document.getElementById('reg-phone').value.trim(),
                        location: document.getElementById('reg-location').value.trim(),
                        role: document.getElementById('reg-role').value
                    });

                    if (user && !user.confirmed_at && user.identities?.length === 0) {
                        showAuthMessage('An account with this email already exists.', 'error');
                    } else {
                        showAuthMessage('Account created successfully! Please check your email to verify your account, then sign in.', 'success');
                        switchTab('login');
                        e.target.reset();
                    }
                } catch (err) {
                    console.error('Register error:', err);
                    showAuthMessage(err.message || 'Registration failed.', 'error');
                } finally {
                    Utils.setBtnLoading(btn, false);
                }
            });

            // Reset Password
            document.getElementById('reset-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!Utils.validateForm(e.target)) return;

                const btn = e.target.querySelector('button[type="submit"]');
                Utils.setBtnLoading(btn, true);

                try {
                    await Auth.resetPassword(document.getElementById('reset-email').value.trim());
                    showAuthMessage('Password reset link sent! Check your email inbox.', 'success');
                    e.target.reset();
                } catch (err) {
                    console.error('Reset error:', err);
                    showAuthMessage(err.message || 'Failed to send reset link.', 'error');
                } finally {
                    Utils.setBtnLoading(btn, false);
                }
            });

            // Check if already logged in
            Auth.getSession().then(session => {
                if (session) {
                    window.location.href = 'dashboard.html';
                }
            });

            // Check for reset param
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('reset') === 'true') {
                switchTab('reset');
            }
        })();
    </script>
</body>
</html>
